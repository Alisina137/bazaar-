name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bazaarlink
      DATABASE_MAX_CONNECTIONS: "5"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "10"
      DATABASE_IDLE_TIMEOUT_SECONDS: "20"
      DATABASE_PREPARE_STATEMENTS: "false"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazaarlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bazaarlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify migration history
        run: pnpm db:check

      - name: Generate Phase 9 migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm db:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/drizzle
          git commit -m "chore(db): add Phase 9 communication migration" || true
          git push origin HEAD:main

      - name: Verify schema has committed migrations
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/drizzle

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify database connectivity
        run: pnpm db:health

      - name: Verify repository
        run: pnpm verify

      - name: Verify database integrations serially
        run: pnpm test:integration
