name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bazaarlink
      DATABASE_MAX_CONNECTIONS: "5"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "10"
      DATABASE_IDLE_TIMEOUT_SECONDS: "20"
      DATABASE_PREPARE_STATEMENTS: "false"
      RUN_DATABASE_INTEGRATION_TESTS: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazaarlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bazaarlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify migration history
        run: pnpm db:check

      - name: Generate database migrations
        run: pnpm db:generate

      - name: Upload generated migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-generated
          path: |
            packages/database/drizzle/0007_*.sql
            packages/database/drizzle/meta/0007_snapshot.json
            packages/database/drizzle/meta/_journal.json
          if-no-files-found: error

      - name: Verify schema has committed migrations
        run: git diff --exit-code -- packages/database/drizzle

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify database connectivity
        run: pnpm db:health

      - name: Verify repository
        run: pnpm verify
