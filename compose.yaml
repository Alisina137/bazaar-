services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bazaarlink
    ports:
      - "5432:5432"
    volumes:
      - bazaarlink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bazaarlink"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  bazaarlink-postgres-data:
